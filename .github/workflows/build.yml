name: Build Windows & Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布 tag（如 v1.2.0）。留空则仅构建上传 artifact，不打 Release。'
        required: false
        default: ''
        type: string
      prerelease:
        description: '标记为预发布（pre-release）'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  windows:
    name: Windows (Flutter)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath jianju-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jianju-windows
          path: jianju-windows.zip

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$SDKMANAGER" "platforms;android-36" > /dev/null
          fi
          if [ ! -d "$ANDROID_HOME/ndk/26.3.11579264" ]; then
            yes | "$SDKMANAGER" "ndk;26.3.11579264" > /dev/null
          fi

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret configured, skipping release signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/jianju-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=jianju-keystore.jks\n' \
            '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            '${{ secrets.ANDROID_KEY_PASSWORD }}' \
            '${{ secrets.ANDROID_KEY_ALIAS }}' > android/key.properties
          echo "Release signing enabled."

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jianju-android
          path: build/app/outputs/flutter-apk/*.apk

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            TAG="${{ inputs.version }}"
            PRE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            PRE="false"
          fi
          if [[ "$TAG" == *-* ]]; then
            PRE="true"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          mkdir -p upload
          echo "Downloaded artifact tree:"
          find dist-artifacts -type f -print
          mapfile -t FILES < <(find dist-artifacts -type f | sort)
          for SRC in "${FILES[@]}"; do
            BASE=$(basename "$SRC")
            case "$BASE" in
              app-release.apk|*-release.apk)
                DEST="upload/Jianju-${VERSION}.apk"
                ;;
              app-debug.apk|*-debug.apk)
                DEST="upload/Jianju-${VERSION}-debug.apk"
                ;;
              jianju-windows.zip|*-windows.zip)
                DEST="upload/Jianju-${VERSION}-windows.zip"
                ;;
              *)
                DEST="upload/$BASE"
                ;;
            esac
            cp "$SRC" "$DEST"
            echo "Prepared $DEST from $SRC"
          done
          ls -lh upload/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: upload/*
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
